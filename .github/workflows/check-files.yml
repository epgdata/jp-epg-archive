# 索引に載っている全ファイルを archive.epgdata.jp から毎日取得し、ハッシュとサイズを確かめる。
# 索引の更新とコミットは配布元のサーバが行う。このジョブは書き込まない（確かめるだけ）ので、
# 配布元のファイルが差し替えられたり消えたりすれば、ここで失敗して気付ける。
name: check-files

on:
  schedule:
    - cron: "17 21 * * *" # 毎日 06:17（日本時間）
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Check
        run: python scripts/sync_manifest.py --check
